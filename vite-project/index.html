<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon (file must be inside the /public folder) -->
    <link rel="icon" type="image/png" href="/dark-mode-logo.png" />
    <link rel="apple-touch-icon" href="/dark-mode-logo.png" />

    <!-- Browser UI colour (mobile Chrome address bar) -->
    <meta name="theme-color" content="#4B1E56" />

    <!-- Primary SEO -->
    <title>Ellevation Ecosystem | One Community. Endless Pathways.</title>
    <meta
      name="description"
      content="Ellevation is a community-led ecosystem in Australia connecting culturally and linguistically diverse (CALD) communities, women, families, professionals, businesses and organisations through Ellevation Hub and Ms Ellevation, creating pathways into confidence, wellbeing, leadership, employment and entrepreneurship."
    />
    <meta
      name="keywords"
      content="Ellevation, Ellevation Hub, Ms Ellevation, CALD communities, multicultural Australia, women empowerment, women leadership, community ecosystem, migrant women, community organisations, mentoring, wellbeing, entrepreneurship, employment pathways"
    />
    <meta name="author" content="Ellevation" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ellevation" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:title" content="Ellevation | One Community. Endless Pathways." />
    <meta
      property="og:description"
      content="A community-led ecosystem creating pathways into confidence, wellbeing, leadership, opportunity and community impact for CALD communities, women and families across Australia."
    />
    <!-- Add after deployment: full URL of your site and a 1200x630 preview image
    <meta property="og:url" content="https://YOUR-DOMAIN/" />
    <meta property="og:image" content="https://YOUR-DOMAIN/og-image.png" />
    <link rel="canonical" href="https://YOUR-DOMAIN/" />
    -->

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ellevation | One Community. Endless Pathways." />
    <meta
      name="twitter:description"
      content="A community-led ecosystem creating pathways into confidence, wellbeing, leadership, opportunity and community impact across Australia."
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to view the Ellevation website.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
